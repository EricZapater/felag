name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      deploy_images:
        description: 'Deploy containers after build'
        required: true
        default: true
        type: boolean
      deploy_mobile:
        description: 'Deploy Mobile App to Expo EAS (consumes monthly build credits)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  # -----------------------------------------------------------------------
  # Stage 1 & 2: Build and Push Docker Images to GHCR
  # -----------------------------------------------------------------------
  build-and-push:
    name: Build & Publish Container Images (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Backend Image Build & Push
      # -----------------------------------------------------------------------
      - name: Extract metadata for Backend Docker image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/felag-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # Frontend Image Build & Push
      # -----------------------------------------------------------------------
      - name: Extract metadata for Frontend Docker image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/felag-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------------
  # Deploy Containers to VPS via SSH & Traefik
  # -----------------------------------------------------------------------
  deploy-to-vps:
    name: Deploy Containers to Remote VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.deploy_images == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.yml"
          target: "~/felag"

      - name: Execute remote deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            mkdir -p ~/felag
            cd ~/felag
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps

  # -----------------------------------------------------------------------
  # Stage 3: Mobile (Expo / EAS Build) - Only on manual dispatch when requested
  # -----------------------------------------------------------------------
  deploy-mobile:
    name: Build Mobile (Expo EAS)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_mobile == true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Expo Credentials
        id: expo-check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "EXPO_TOKEN is not set. Skipping automated cloud build for mobile."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.expo-check.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS
        if: steps.expo-check.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install pnpm
        if: steps.expo-check.outputs.has_token == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        if: steps.expo-check.outputs.has_token == 'true'
        run: pnpm install --registry=https://registry.npmjs.org/

      - name: Trigger EAS Build Preview
        if: steps.expo-check.outputs.has_token == 'true'
        run: |
          cd mobile
          eas init --account felag --non-interactive || true
          eas build --profile preview --platform android --non-interactive
