name: Deploy to VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Self-Hosted VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on Remote VPS via SSH
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          APP_DIR: ${{ secrets.APP_DIR || '~/felag' }}
        run: |
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "mkdir -p $APP_DIR"
          
          # Sync project files excluding git/node_modules
          rsync -avz -e "ssh -p $SSH_PORT" --exclude '.git' --exclude 'node_modules' --exclude '.pnpm-store' --exclude 'mobile/.expo' ./ $SSH_USER@$SSH_HOST:$APP_DIR/

          # Build and restart containers on VPS
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "cd $APP_DIR && docker compose -f docker-compose.prod.yml up -d --build --remove-orphans"

      - name: Verify Backend Health Check
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "Checking backend health status..."
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "sleep 3 && curl -f http://localhost:8080/health || exit 1"
          echo "Deployment completed and healthy!"
