name: Mobile Build (EAS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development
          - production

jobs:
  build:
    name: EAS Build (${{ inputs.platform }} - ${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --registry=https://registry.npmjs.org/

      - name: Run EAS Build
        run: |
          cd mobile
          eas init --account felag --non-interactive || true
          if [ "${{ inputs.platform }}" = "all" ]; then
            eas build --profile ${{ inputs.profile }} --platform all --non-interactive
          else
            eas build --profile ${{ inputs.profile }} --platform ${{ inputs.platform }} --non-interactive
          fi
