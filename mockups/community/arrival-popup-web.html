<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FELAG — Pop-up d'Arribada (Web)</title>
  <style>
    :root {
      --terracotta: #C85A32;
      --terracotta-hover: #b04b26;
      --sand-light: #F9F6F0;
      --sand-medium: #FAF7F2;
      --sand-dark: #E8E2D9;
      --earth-brown: #2C221E;
      --earth-gold: #D4A373;
      --text-muted: #6B5E57;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: rgba(44, 34, 30, 0.6); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .modal-box {
      background: var(--white);
      max-width: 520px;
      width: 100%;
      border-radius: 24px;
      padding: 2.25rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      border: 1px solid var(--sand-dark);
      text-align: center;
    }
    .modal-badge {
      width: 64px;
      height: 64px;
      background: #FDEEE9;
      color: var(--terracotta);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.25rem;
    }
    .modal-title { font-size: 1.5rem; font-weight: 800; color: var(--earth-brown); margin-bottom: 0.5rem; }
    .modal-subtitle { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1.5rem; }

    .privacy-options { display: flex; flex-direction: column; gap: 0.75rem; text-align: left; margin-bottom: 1.75rem; }
    .option-card {
      border: 2px solid var(--sand-dark);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      transition: all 0.2s ease;
    }
    .option-card:hover { border-color: var(--earth-gold); background: var(--sand-medium); }
    .option-card.selected { border-color: var(--terracotta); background: #FDF7F4; }
    .option-radio { margin-top: 4px; accent-color: var(--terracotta); transform: scale(1.2); }
    .option-title { font-weight: 700; font-size: 1rem; color: var(--earth-brown); margin-bottom: 2px; }
    .option-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

    .btn-submit {
      background: var(--terracotta);
      color: var(--white);
      border: none;
      padding: 0.85rem 1.75rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s ease;
    }
    .btn-submit:hover { background: var(--terracotta-hover); }
    .privacy-note { font-size: 0.75rem; color: var(--text-muted); margin-top: 1rem; }
  </style>
</head>
<body>

  <div class="modal-box">
    <div class="modal-badge">🗼</div>
    <h2 class="modal-title">Benvingut/da a Tòquio! 📍✨</h2>
    <p class="modal-subtitle">Comença el teu viatge a Tòquio. Vols compartir fotos en temps real amb altres FELAGIS que són a la ciutat ara mateix?</p>

    <div class="privacy-options">

      <label class="option-card selected">
        <input type="radio" name="privacy" class="option-radio" checked>
        <div>
          <div class="option-title">🌍 Amb tots els FELAGIS que coincideixin</div>
          <div class="option-desc">Les teves fotos apareixeran al Feed en Viu de Tòquio per a tots els viatgers amb dates solapades.</div>
        </div>
      </label>

      <label class="option-card">
        <input type="radio" name="privacy" class="option-radio">
        <div>
          <div class="option-title">🏡 Només amb els meus propers</div>
          <div class="option-desc">Visible únicament per a FELAGIS del teu mateix poble/regió o amb qui tinguis xat obert.</div>
        </div>
      </label>

      <label class="option-card">
        <input type="radio" name="privacy" class="option-radio">
        <div>
          <div class="option-title">🔒 Amb ningú (Mode Privat)</div>
          <div class="option-desc">No compartir cap foto al feed efímer. Pots canviar d'opció quan vulguis.</div>
        </div>
      </label>

    </div>

    <button class="btn-submit">Confirmar i Continuar 🚀</button>
    <p class="privacy-note">🔒 Les fotos només són visibles durant el període de solapament del viatge.</p>
  </div>

</body>
</html>
