<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FELAG — Pop-up d'Arribada (Mobile)</title>
  <style>
    :root {
      --terracotta: #C85A32;
      --sand-light: #F9F6F0;
      --sand-medium: #FAF7F2;
      --sand-dark: #E8E2D9;
      --earth-brown: #2C221E;
      --text-muted: #6B5E57;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--sand-light); color: var(--earth-brown); display: flex; justify-content: center; padding: 20px 0; }
    
    .mobile-frame {
      width: 375px;
      height: 812px;
      background: rgba(44, 34, 30, 0.7);
      border-radius: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      border: 8px solid #2C221E;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      position: relative;
    }
    .status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 0.8rem; font-weight: 600; color: var(--white); position: absolute; top: 0; left: 0; right: 0; }

    .bottom-sheet {
      background: var(--white);
      border-radius: 28px 28px 0 0;
      padding: 24px 20px 32px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
    }
    .drag-handle { width: 36px; height: 4px; background: var(--sand-dark); border-radius: 2px; margin: 0 auto 16px; }

    .sheet-title { font-size: 1.3rem; font-weight: 800; text-align: center; margin-bottom: 6px; }
    .sheet-desc { font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 18px; line-height: 1.4; }

    .option-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .opt-m {
      border: 2px solid var(--sand-dark);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .opt-m.selected { border-color: var(--terracotta); background: #FDF7F4; }
    .opt-m input { margin-top: 3px; accent-color: var(--terracotta); }
    .opt-m-title { font-size: 0.9rem; font-weight: 700; color: var(--earth-brown); }
    .opt-m-desc { font-size: 0.75rem; color: var(--text-muted); line-height: 1.3; margin-top: 2px; }

    .btn-action-m {
      background: var(--terracotta);
      color: var(--white);
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>📶 5G 🔋 100%</span>
    </div>

    <div class="bottom-sheet">
      <div class="drag-handle"></div>
      <h2 class="sheet-title">Benvingut/da a Tòquio! 📍✨</h2>
      <p class="sheet-desc">Vols compartir fotos en directe amb altres FELAGIS que estan a la ciutat durant el teu viatge?</p>

      <div class="option-list">

        <label class="opt-m selected">
          <input type="radio" name="p-mob" checked>
          <div>
            <div class="opt-m-title">🌍 Amb tots els FELAGIS coincidents</div>
            <div class="opt-m-desc">Visible al Feed en Viu de Tòquio durant el viatge.</div>
          </div>
        </label>

        <label class="opt-m">
          <input type="radio" name="p-mob">
          <div>
            <div class="opt-m-title">🏡 Només amb els meus propers</div>
            <div class="opt-m-desc">Visible només per FELAGIS del teu poble o xats oberts.</div>
          </div>
        </label>

        <label class="opt-m">
          <input type="radio" name="p-mob">
          <div>
            <div class="opt-m-title">🔒 Amb ningú (Privat)</div>
            <div class="opt-m-desc">Mantenir el viatge en mode privat.</div>
          </div>
        </label>

      </div>

      <button class="btn-action-m">Desar Preferència 🚀</button>
    </div>
  </div>

</body>
</html>
