<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FELAG — Feed en Viu (Mobile)</title>
  <style>
    :root {
      --terracotta: #C85A32;
      --sand-light: #F9F6F0;
      --sand-medium: #FAF7F2;
      --sand-dark: #E8E2D9;
      --earth-brown: #2C221E;
      --text-muted: #6B5E57;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--sand-light); color: var(--earth-brown); display: flex; justify-content: center; padding: 20px 0; }
    
    .mobile-frame {
      width: 375px;
      height: 812px;
      background: var(--sand-light);
      border-radius: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      border: 8px solid #2C221E;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 0.8rem; font-weight: 600; background: var(--white); }
    .header-m { background: var(--white); padding: 12px 16px; border-bottom: 1px solid var(--sand-dark); display: flex; justify-content: space-between; align-items: center; }
    .header-m-title { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .live-badge-m { background: #E65100; color: var(--white); font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 6px; }

    .feed-scroll { flex: 1; overflow-y: auto; padding: 12px 16px 80px; }
    .post-m { background: var(--white); border-radius: 16px; border: 1px solid var(--sand-dark); margin-bottom: 16px; overflow: hidden; }
    .post-m-user { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
    .post-m-author { font-size: 0.85rem; font-weight: 700; }
    .post-m-origin { font-size: 0.75rem; background: #FFF3E0; color: #E65100; padding: 2px 6px; border-radius: 6px; font-weight: 600; }
    .post-m-img { width: 100%; height: 260px; object-fit: cover; }
    .post-m-caption { padding: 10px 12px; font-size: 0.85rem; line-height: 1.4; }

    .fab-cam { position: absolute; bottom: 70px; right: 20px; width: 56px; height: 56px; border-radius: 28px; background: var(--terracotta); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 4px 12px rgba(200,90,50,0.4); text-decoration: none; }

    .bottom-tab { height: 60px; background: var(--white); border-top: 1px solid var(--sand-dark); display: flex; justify-content: space-around; align-items: center; }
    .tab-item { display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; color: var(--text-muted); text-decoration: none; font-weight: 600; }
    .tab-item.active { color: var(--terracotta); }
    .tab-icon { font-size: 1.2rem; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>📶 5G 🔋 100%</span>
    </div>

    <div class="header-m">
      <div class="header-m-title">
        <span>📸 Tòquio en Viu</span>
        <span class="live-badge-m">EN DIRECTE</span>
      </div>
      <span style="font-size: 0.8rem; color: var(--text-muted);">8 FELAGIS</span>
    </div>

    <div class="feed-scroll">

      <div class="post-m">
        <div class="post-m-user">
          <span class="post-m-author">Marc Soler</span>
          <span class="post-m-origin">📍 Terrassa</span>
        </div>
        <img class="post-m-img" src="https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=500&auto=format&fit=crop&q=80" alt="Shibuya">
        <div class="post-m-caption">Creuant Shibuya de nit, increïble ambient! 🏙️ (fa 2h)</div>
      </div>

      <div class="post-m">
        <div class="post-m-user">
          <span class="post-m-author">Laia Puig</span>
          <span class="post-m-origin">📍 Girona</span>
        </div>
        <img class="post-m-img" src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=500&auto=format&fit=crop&q=80" alt="Temple">
        <div class="post-m-caption">Matí de calma a Asakusa Sensō-ji ⛩️ (fa 5h)</div>
      </div>

    </div>

    <a href="#" class="fab-cam">📷</a>

    <div class="bottom-tab">
      <a href="#" class="tab-item"><span class="tab-icon">✈️</span>Viatges</a>
      <a href="#" class="tab-item active"><span class="tab-icon">🗺️</span>Destins</a>
      <a href="#" class="tab-item"><span class="tab-icon">💬</span>Xats</a>
      <a href="#" class="tab-item"><span class="tab-icon">🔔</span>Avisos</a>
      <a href="#" class="tab-item"><span class="tab-icon">👤</span>Perfil</a>
    </div>
  </div>

</body>
</html>
