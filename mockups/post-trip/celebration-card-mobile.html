<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FELAG — Celebration Card (Mobile)</title>
  <style>
    :root {
      --terracotta: #C85A32;
      --sand-light: #F9F6F0;
      --sand-medium: #FAF7F2;
      --sand-dark: #E8E2D9;
      --earth-brown: #2C221E;
      --text-muted: #6B5E57;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--sand-light); color: var(--earth-brown); display: flex; justify-content: center; padding: 20px 0; }
    
    .mobile-frame {
      width: 375px;
      height: 812px;
      background: var(--sand-light);
      border-radius: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      border: 8px solid #2C221E;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 0.8rem; font-weight: 600; background: var(--white); }
    .header-m { background: var(--white); padding: 12px 16px; border-bottom: 1px solid var(--sand-dark); display: flex; justify-content: space-between; align-items: center; }
    .header-m-title { font-size: 1.1rem; font-weight: 800; }

    .content-scroll { flex: 1; overflow-y: auto; padding: 16px; }

    /* The Celebration Card */
    .celebration-m-card {
      background: linear-gradient(180deg, #FFFFFF 0%, #FAF7F2 100%);
      border: 3px solid var(--terracotta);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(200,90,50,0.2);
      text-align: center;
      margin-bottom: 16px;
    }
    .badge-cel-m { background: #FDEEE9; color: var(--terracotta); font-size: 0.7rem; font-weight: 800; padding: 2px 8px; border-radius: 8px; display: inline-block; margin-bottom: 8px; }
    .img-cel-m { width: 100%; height: 200px; border-radius: 12px; object-fit: cover; margin-bottom: 10px; }
    .title-cel-m { font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; }
    .sub-cel-m { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
    .footer-cel-m { border-top: 1px solid var(--sand-dark); padding-top: 8px; display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: 700; color: var(--terracotta); }

    .btn-m-row { display: flex; flex-direction: column; gap: 8px; }
    .btn-action-m { background: var(--terracotta); color: var(--white); border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; cursor: pointer; text-align: center; }
    .btn-secondary-m { background: var(--earth-brown); color: var(--white); }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>📶 5G 🔋 100%</span>
    </div>

    <div class="header-m">
      <div style="display:flex; align-items:center; gap:8px;">
        <a href="#" style="text-decoration:none; font-size:1.2rem; color:var(--terracotta);">‹</a>
        <h1 class="header-m-title">📸 Celebration Card</h1>
      </div>
    </div>

    <div class="content-scroll">
      <div class="celebration-m-card">
        <span class="badge-cel-m">🎉 ENS HEM TROBAT!</span>
        <img class="img-cel-m" src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=500&auto=format&fit=crop&q=80" alt="Meetup">
        <h2 class="title-cel-m">L'Èric i el Marc a Tòquio! 🗼✨</h2>
        <p class="sub-cel-m">Terrassa 🤝 Sabadell • Shibuya Crossing</p>
        <div class="footer-cel-m">
          <span>FELAG • Japó</span>
          <span>4 Setembre 2026</span>
        </div>
      </div>

      <div class="btn-m-row">
        <button class="btn-action-m">📲 Enviar al Xat & Compartir</button>
        <button class="btn-action-m btn-secondary-m">📥 Desar al Carret</button>
      </div>
    </div>
  </div>

</body>
</html>
