<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FELAG — Hub Viatge & Stories (Mobile)</title>
  <style>
    :root {
      --terracotta: #C85A32;
      --sand-light: #F9F6F0;
      --sand-medium: #FAF7F2;
      --sand-dark: #E8E2D9;
      --earth-brown: #2C221E;
      --text-muted: #6B5E57;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--sand-light); color: var(--earth-brown); display: flex; justify-content: center; padding: 20px 0; }
    
    .mobile-frame {
      width: 375px;
      height: 812px;
      background: var(--sand-light);
      border-radius: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      border: 8px solid #2C221E;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 0.8rem; font-weight: 600; background: var(--white); }
    .content-scroll { flex: 1; overflow-y: auto; padding: 16px 16px 80px; }

    /* Active Trip Banner */
    .active-m-card {
      background: linear-gradient(135deg, #2C221E 0%, #4A3B32 100%);
      color: var(--white);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .active-m-badge { background: #E65100; color: var(--white); font-size: 0.7rem; font-weight: 800; padding: 2px 8px; border-radius: 8px; display: inline-block; margin-bottom: 6px; }
    .active-m-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 2px; }
    .active-m-dates { font-size: 0.8rem; opacity: 0.85; margin-bottom: 14px; }

    .hub-m-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .hub-m-btn { background: rgba(255,255,255,0.12); border-radius: 12px; padding: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.15); text-decoration: none; color: var(--white); }
    .hub-m-icon { font-size: 1.4rem; margin-bottom: 2px; display: block; }
    .hub-m-label { font-size: 0.8rem; font-weight: 700; display: block; }

    /* Section Cards */
    .section-m-title { font-size: 1rem; font-weight: 800; margin: 16px 0 8px; }
    .story-m-preview {
      background: #2C221E;
      border-radius: 16px;
      padding: 14px;
      color: var(--white);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .btn-share-m { background: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%); color: var(--white); border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; }

    .bottom-tab { height: 60px; background: var(--white); border-top: 1px solid var(--sand-dark); display: flex; justify-content: space-around; align-items: center; }
    .tab-item { display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; color: var(--text-muted); text-decoration: none; font-weight: 600; }
    .tab-item.active { color: var(--terracotta); }
    .tab-icon { font-size: 1.2rem; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>📶 5G 🔋 100%</span>
    </div>

    <div class="content-scroll">

      <!-- Active Hub Card -->
      <div class="active-m-card">
        <span class="active-m-badge">⚡ VIATGE EN CURS</span>
        <h1 class="active-m-title">Japó: Tòquio i Kyoto 🇯🇵</h1>
        <p class="active-m-dates">1 - 15 Setembre 2026 (Dia 4)</p>

        <div class="hub-m-grid">
          <a href="#" class="hub-m-btn">
            <span class="hub-m-icon">📸</span>
            <span class="hub-m-label">Celebration Card</span>
          </a>
          <a href="#" class="hub-m-btn">
            <span class="hub-m-icon">🖼️</span>
            <span class="hub-m-label">Àlbum (12 fotos)</span>
          </a>
          <a href="#" class="hub-m-btn">
            <span class="hub-m-icon">📍</span>
            <span class="hub-m-label">Feed en Viu</span>
          </a>
          <a href="#" class="hub-m-btn">
            <span class="hub-m-icon">🔒</span>
            <span class="hub-m-label">Privadesa</span>
          </a>
        </div>
      </div>

      <!-- Instagram Report Teaser -->
      <h2 class="section-m-title">Reportatge Instagram Stories 9:16</h2>
      <div class="story-m-preview">
        <div>
          <strong style="font-size: 0.9rem;">El teu àlbum resum ✨</strong>
          <p style="font-size: 0.75rem; opacity: 0.8;">Format 9:16 preparat per a xarxes</p>
        </div>
        <button class="btn-share-m">📲 Compartir</button>
      </div>

    </div>

    <div class="bottom-tab">
      <a href="#" class="tab-item active"><span class="tab-icon">✈️</span>Viatges</a>
      <a href="#" class="tab-item"><span class="tab-icon">🗺️</span>Destins</a>
      <a href="#" class="tab-item"><span class="tab-icon">💬</span>Xats</a>
      <a href="#" class="tab-item"><span class="tab-icon">🔔</span>Avisos</a>
      <a href="#" class="tab-item"><span class="tab-icon">👤</span>Perfil</a>
    </div>
  </div>

</body>
</html>
