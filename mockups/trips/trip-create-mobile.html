<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FELAG — Nou viatge (Mobile)</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background-color: #E8E2D9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .mobile-frame { background: #F9F6F0; width: 375px; height: 750px; border-radius: 36px; border: 12px solid #3E2723; box-shadow: 0 10px 30px rgba(62, 39, 35, 0.2); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .status-bar { height: 40px; background: #FFFFFF; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 12px; font-weight: bold; color: #4A3E39; }
    .app-header { background: #FFFFFF; padding: 16px 20px; font-size: 16px; font-weight: 700; border-bottom: 1px solid #E8E2D9; display: flex; justify-content: space-between; align-items: center; }
    .back-btn { text-decoration: none; color: #C85A32; font-size: 14px; font-weight: 600; }
    
    .content { flex: 1; overflow-y: auto; padding: 16px; }
    .card { background: #FFFFFF; border-radius: 12px; padding: 16px; border: 1px solid #E8E2D9; margin-bottom: 16px; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #4A3E39; letter-spacing: 0.5px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #DDCFBF; border-radius: 8px; font-size: 14px; background: #FAF7F2; outline: none; }
    
    .stage-item { background: #FAF7F2; border: 1px solid #E8E2D9; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .stage-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; color: #C85A32; margin-bottom: 8px; }
    
    .btn-add { width: 100%; padding: 10px; border: 1px dashed #C85A32; background: transparent; color: #C85A32; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; margin-bottom: 16px; }
    .btn-save { width: 100%; padding: 14px; background-color: #C85A32; color: #fff; border: none; border-radius: 28px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>100%</span>
    </div>

    <div class="app-header">
      <a href="trips-list-mobile.html" class="back-btn">‹ Enrere</a>
      <span>Nou viatge</span>
      <span style="width: 45px;"></span>
    </div>

    <div class="content">
      <div class="card">
        <div class="form-group">
          <label>Títol</label>
          <input type="text" value="Ruta per Escandinàvia">
        </div>

        <div class="form-group">
          <label>Data d'inici</label>
          <input type="date" value="2026-10-10">
        </div>

        <div class="form-group">
          <label>Data de finalització</label>
          <input type="date" value="2026-10-24">
        </div>

        <div class="form-group">
          <label>Visibilitat</label>
          <select>
            <option>Públic (Matching)</option>
            <option>Només contactes</option>
            <option>Privat</option>
          </select>
        </div>
      </div>

      <div class="card">
        <label style="margin-bottom: 12px;">Etapes / Destinacions</label>

        <div class="stage-item">
          <div class="stage-header">
            <span>1. Estocolm</span>
            <span style="color:#d32f2f; font-size:11px;">✕</span>
          </div>
          <div style="font-size: 12px; color: #786C65;">10 Oct – 15 Oct</div>
        </div>

        <div class="stage-item">
          <div class="stage-header">
            <span>2. Oslo</span>
            <span style="color:#d32f2f; font-size:11px;">✕</span>
          </div>
          <div style="font-size: 12px; color: #786C65;">15 Oct – 20 Oct</div>
        </div>

        <button class="btn-add">＋ Afegir destinació</button>
      </div>

      <button class="btn-save">Crear viatge</button>
    </div>
  </div>

</body>
</html>
