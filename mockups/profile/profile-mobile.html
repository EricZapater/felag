<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FELAG — Perfil (Mobile)</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background-color: #E8E2D9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .mobile-frame { background: #F9F6F0; width: 375px; height: 750px; border-radius: 36px; border: 12px solid #3E2723; box-shadow: 0 10px 30px rgba(62, 39, 35, 0.2); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .status-bar { height: 40px; background: #FFFFFF; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 12px; font-weight: bold; color: #4A3E39; }
    .app-header { background: #FFFFFF; padding: 16px; font-size: 18px; font-weight: 700; text-align: center; border-bottom: 1px solid #E8E2D9; color: #C85A32; }
    
    .content { flex: 1; overflow-y: auto; padding: 16px; }
    .card { background: #FFFFFF; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(74, 46, 43, 0.05); border: 1px solid #E8E2D9; margin-bottom: 16px; }
    
    .profile-top { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
    .avatar-wrapper { position: relative; margin-bottom: 12px; }
    .avatar { width: 84px; height: 84px; border-radius: 50%; background-color: #F4ECE1; display: flex; justify-content: center; align-items: center; font-size: 32px; color: #703817; border: 3px solid #C85A32; }
    .btn-upload { position: absolute; bottom: 0; right: 0; background: #C85A32; color: white; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 12px; display: flex; justify-content: center; align-items: center; }
    
    .user-name { font-size: 20px; font-weight: 700; color: #2C221E; margin-bottom: 4px; }
    .user-email { font-size: 13px; color: #786C65; }
    .user-phone { font-size: 12px; color: #C85A32; font-weight: 500; margin-top: 2px; }
    
    .section-title { font-size: 14px; font-weight: 600; text-transform: uppercase; color: #786C65; margin-bottom: 12px; letter-spacing: 0.5px; }
    
    .origin-box { background: #F4ECE1; border: 1px solid #DDCFBF; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .origin-path { font-size: 15px; font-weight: 700; color: #703817; margin-top: 4px; }
    
    .btn-full { width: 100%; padding: 12px; background: transparent; border: 1px solid #C85A32; color: #C85A32; border-radius: 20px; font-size: 14px; font-weight: 600; text-align: center; cursor: pointer; text-decoration: none; display: block; }

    .nav-bar { height: 60px; background: #FFFFFF; border-top: 1px solid #E8E2D9; display: flex; justify-content: space-around; align-items: center; }
    .nav-item { font-size: 11px; color: #786C65; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; }
    .nav-item.active { color: #C85A32; font-weight: bold; }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>100%</span>
    </div>

    <div class="app-header">Perfil</div>

    <div class="content">
      <div class="card profile-top">
        <div class="avatar-wrapper">
          <div class="avatar">OS</div>
          <button class="btn-upload">📷</button>
        </div>
        <div class="user-name">Oriol Soler</div>
        <div class="user-email">oriol@exemple.cat</div>
        <div class="user-phone">📱 +34 612 34 56 78 (MFA)</div>
      </div>

      <div class="card">
        <div class="section-title">El teu origen</div>
        <div class="origin-box">
          <div style="font-size: 11px; color: #8C7A70; text-transform: uppercase;">Jerarquia</div>
          <div class="origin-path">Espanya ➔ Catalunya ➔ Vic</div>
        </div>
        <a href="origin-selector-mobile.html" class="btn-full">Canviar origen</a>
      </div>
    </div>

    <div class="nav-bar">
      <a href="#" class="nav-item"><span>✈️</span>Viatges</a>
      <a href="#" class="nav-item"><span>🔍</span>Matching</a>
      <a href="#" class="nav-item active"><span>👤</span>Perfil</a>
    </div>
  </div>

</body>
</html>
