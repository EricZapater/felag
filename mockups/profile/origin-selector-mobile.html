<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FELAG — Selecció d'Origen (Mobile)</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background-color: #E8E2D9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .mobile-frame { background: #F9F6F0; width: 375px; height: 750px; border-radius: 36px; border: 12px solid #3E2723; box-shadow: 0 10px 30px rgba(62, 39, 35, 0.2); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .status-bar { height: 40px; background: #FFFFFF; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 12px; font-weight: bold; color: #4A3E39; }
    .app-header { background: #FFFFFF; padding: 16px; font-size: 16px; font-weight: 700; text-align: center; border-bottom: 1px solid #E8E2D9; display: flex; justify-content: space-between; align-items: center; }
    .back-btn { text-decoration: none; color: #C85A32; font-size: 14px; font-weight: 600; }
    
    .content { flex: 1; overflow-y: auto; padding: 20px; }
    .title { font-size: 18px; font-weight: 700; color: #2C221E; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #786C65; margin-bottom: 24px; line-height: 1.4; }
    
    .field-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #C85A32; letter-spacing: 0.5px; }
    select { width: 100%; padding: 14px; border: 1px solid #DDCFBF; border-radius: 8px; font-size: 15px; background: #FFFFFF; color: #2C221E; outline: none; }
    
    .summary-card { background: #F4ECE1; border: 1px solid #DDCFBF; border-radius: 12px; padding: 16px; margin-top: 24px; text-align: center; }
    .summary-title { font-size: 11px; text-transform: uppercase; color: #8C7A70; font-weight: 600; margin-bottom: 4px; }
    .summary-value { font-size: 15px; font-weight: 700; color: #703817; }
    
    .btn-save { width: 100%; padding: 16px; background-color: #C85A32; color: #fff; border: none; border-radius: 28px; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; margin-top: 32px; }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>100%</span>
    </div>

    <div class="app-header">
      <a href="profile-mobile.html" class="back-btn">‹ Enrere</a>
      <span>Origen</span>
      <span style="width: 45px;"></span>
    </div>

    <div class="content">
      <div class="title">On són les teves arrels?</div>
      <div class="subtitle">Selecciona el teu País, Regió i Poble de les llistes oficials.</div>

      <div class="field-group">
        <label>1. País</label>
        <select>
          <option selected>Espanya</option>
          <option>França</option>
          <option>Itàlia</option>
        </select>
      </div>

      <div class="field-group">
        <label>2. Regió / Comunitat</label>
        <select>
          <option selected>Catalunya</option>
          <option>Comunitat Valenciana</option>
          <option>Illes Balears</option>
        </select>
      </div>

      <div class="field-group">
        <label>3. Poble / Ciutat</label>
        <select>
          <option selected>Vic</option>
          <option>Barcelona</option>
          <option>Girona</option>
        </select>
      </div>

      <div class="summary-card">
        <div class="summary-title">Origen seleccionat</div>
        <div class="summary-value">Espanya ➔ Catalunya ➔ Vic</div>
      </div>

      <button class="btn-save">Desar origen</button>
    </div>
  </div>

</body>
</html>
