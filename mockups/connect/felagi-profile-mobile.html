<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FELAG — Perfil de Mireia (Mobile)</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background-color: #E8E2D9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .mobile-frame { background: #F9F6F0; width: 375px; height: 750px; border-radius: 36px; border: 12px solid #3E2723; box-shadow: 0 10px 30px rgba(62, 39, 35, 0.2); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .status-bar { height: 40px; background: #FFFFFF; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 12px; font-weight: bold; color: #4A3E39; }
    
    .app-header { background: #FFFFFF; padding: 14px 16px; font-size: 15px; font-weight: 700; border-bottom: 1px solid #E8E2D9; display: flex; justify-content: space-between; align-items: center; }
    .back-btn { text-decoration: none; color: #C85A32; font-size: 14px; font-weight: 600; }
    
    .content { flex: 1; overflow-y: auto; padding: 20px 16px; }
    
    .profile-box { background: #FFFFFF; border: 1px solid #E8E2D9; border-radius: 12px; padding: 24px 16px; text-align: center; margin-bottom: 16px; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; background: #F4ECE1; color: #703817; border: 2px solid #C85A32; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; margin: 0 auto 12px; }
    .name { font-size: 18px; font-weight: 700; color: #2C221E; margin-bottom: 4px; }
    .badge-town { display: inline-block; background: #FFF3E0; color: #E65100; border: 1px solid #FFE0B2; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; margin-bottom: 12px; }
    .bio { font-size: 13px; color: #4A3E39; line-height: 1.4; margin-bottom: 16px; }
    
    .btn-chat { background: #C85A32; color: #FFFFFF; text-decoration: none; padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: 700; display: inline-block; }
    
    .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #786C65; margin-bottom: 10px; letter-spacing: 0.5px; }
    .trips-card { background: #FFFFFF; border: 1px solid #E8E2D9; border-radius: 12px; padding: 14px; }
    .trip-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .trip-dest { font-weight: 700; color: #2C221E; }
    .trip-date { color: #786C65; font-size: 11px; }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>100%</span>
    </div>

    <div class="app-header">
      <a href="chat-mobile.html" class="back-btn">‹ Xat</a>
      <span>Perfil de FELAGI</span>
      <span style="width: 35px;"></span>
    </div>

    <div class="content">
      <div class="profile-box">
        <div class="avatar">MM</div>
        <h1 class="name">Mireia Masnou</h1>
        <span class="badge-town">📍 Vic (Catalunya)</span>
        <p class="bio">Apasssionada de la fotografia de natura, el senderisme i descobrir racons autèntics arreu del món.</p>
        <a href="chat-mobile.html" class="btn-chat">Obrir Xat 💬</a>
      </div>

      <div class="section-title">Viatges públics</div>
      <div class="trips-card">
        <div class="trip-row">
          <div>
            <div class="trip-dest">Escandinàvia d'hivern</div>
            <div class="trip-date">📍 Estocolm, Suècia</div>
          </div>
          <div class="trip-date">11–18 Oct 2026</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
