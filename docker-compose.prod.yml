version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: felag-backend
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - ./uploads/avatars:/app/uploads/avatars
    networks:
      - felag-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: felag-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - felag-network

networks:
  felag-network:
    driver: bridge
